[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meddelta"
version = "0.1.0"
description = "MedDelta-RAG: Comparability-First Retrieval for Evidence-Linked Temporal Change Detection"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Prathamesh P Koli" },
]
keywords = ["clinical-nlp", "rag", "retrieval", "temporal-change", "ehr", "medical-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28",
    "pandas>=2.0",
    "plotly>=5.18",
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "pandas-stubs~=3.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
